version: '3.8'

services:
  # Backend service
  backend:
    build: ./backend
    container_name: org-agents-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - qdrant

  # Frontend service (Placeholder, assuming standard Vite setup)
  # frontend:
  #   build: ./frontend
  #   container_name: org-agents-frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: org-agents-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
